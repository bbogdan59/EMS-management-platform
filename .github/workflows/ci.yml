name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: ems
          POSTGRES_DB: ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems -d ems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ems:ems@localhost:5432/ems_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-secret-key-not-for-production
      ENVIRONMENT: test
      BOOTSTRAP_ADMIN_TOKEN: ci-bootstrap-token
      OPCOM_USE_SYNTHETIC_FIXTURE_ON_FAILURE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Lint (ruff check) -- see docs/CODE_STANDARDS.md
        run: ruff check .

      - name: Unit + integration tests
        run: pytest tests/ -q --ignore=tests/e2e

      # Playwright e2e needs a browser install step and is more brittle in
      # a shared CI runner; not wired in yet. See docs/CODE_STANDARDS.md.
