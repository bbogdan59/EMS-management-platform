<section class="location-picker" data-location-picker aria-label="Fixeaza locatia pe harta">
  <div class="map-toolbar">
    <div><h3>Fixeaza pe harta</h3><p>Apasa pe casa ta sau trage pinul pentru a alege locatia exacta.</p></div>
    <div class="map-actions">
      <button type="button" class="btn-secondary" data-locate>Foloseste locatia mea</button>
      <button type="button" class="btn-secondary" data-pin-center>Fixeaza in centrul hartii</button>
    </div>
  </div>
  <div class="station-map picker-map" data-map-canvas aria-label="Harta pentru alegerea locatiei"></div>
  <p class="map-notice" data-map-error role="status" hidden>Harta nu este disponibila. Poti introduce coordonatele manual.</p>
  <p class="map-caption" data-location-status role="status">Coordonatele se salveaza la trimiterea formularului.</p>
</section>
