<!DOCTYPE html>
<html lang="ro" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="/static/js/vendor/htmx.min.js"></script>
  <script src="/static/js/vendor/echarts.min.js"></script>
  <script>
    (function () {
      const stored = localStorage.getItem("ems-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "dark" || (!stored && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="h-full min-h-screen bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100" hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
{% block body %}
<div class="flex min-h-screen flex-col">
  {% include "partials/_nav.html" %}
  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/_footer.html" %}
</div>
{% endblock %}
</body>
</html>
