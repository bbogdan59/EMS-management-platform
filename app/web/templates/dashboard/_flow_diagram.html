<svg id="energy-flow-diagram" viewBox="0 0 600 285" class="energy-flow-scene" role="img" aria-labelledby="energy-flow-title energy-flow-summary">
<title id="energy-flow-title">Diagrama fluxurilor de energie</title>
<desc id="energy-flow-desc">Schema ilustrativa: fluxuri nete intre PV, consum, baterie, retea, EV si bus AC al statiei. Directiile si valorile provin din telemetrie.</desc>
<defs>

  <linearGradient id="house-window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf1c8"/><stop offset="1" stop-color="#b8cc8f"/></linearGradient>
  <linearGradient id="roof-solar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#668868"/><stop offset="1" stop-color="#294f3c"/></linearGradient>
  <filter id="scene-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#264629" flood-opacity=".11"/></filter>

</defs>
