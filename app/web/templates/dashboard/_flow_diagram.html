<svg viewBox="0 0 480 220" class="mx-auto w-full max-w-2xl" role="img" aria-label="Diagrama fluxurilor de energie">
  <!-- Noduri -->
  <g font-size="12" font-family="sans-serif">
    <!-- PV (sus stanga) -->
    <circle cx="90" cy="40" r="30" class="fill-amber-100 stroke-amber-500 dark:fill-amber-900/40" stroke-width="2" />
    <text x="90" y="44" text-anchor="middle" class="fill-gray-800 dark:fill-gray-100">PV</text>

    <!-- Casa (centru) -->
    <rect x="200" y="90" width="80" height="50" rx="8" class="fill-brand-100 stroke-brand-600 dark:fill-brand-900/40" stroke-width="2" />
    <text x="240" y="120" text-anchor="middle" class="fill-gray-800 dark:fill-gray-100">Consum casa</text>

    <!-- Baterie (jos stanga) -->
    <rect x="60" y="160" width="70" height="45" rx="8" class="fill-green-100 stroke-green-600 dark:fill-green-900/40" stroke-width="2" />
    <text x="95" y="187" text-anchor="middle" class="fill-gray-800 dark:fill-gray-100">Baterie</text>

    <!-- Retea (sus dreapta) -->
    <rect x="360" y="20" width="90" height="45" rx="8" class="fill-gray-200 stroke-gray-500 dark:fill-gray-800" stroke-width="2" />
    <text x="405" y="47" text-anchor="middle" class="fill-gray-800 dark:fill-gray-100">Retea</text>

    <!-- EV (jos dreapta) -->
    <rect x="360" y="160" width="90" height="45" rx="8" class="fill-sky-100 stroke-sky-600 dark:fill-sky-900/40" stroke-width="2" />
    <text x="405" y="187" text-anchor="middle" class="fill-gray-800 dark:fill-gray-100">EV</text>
  </g>

  <!-- Legaturi (opacitatea e actualizata din JS in functie de directia fluxului) -->
  <g stroke-width="3" fill="none">
    <line id="flow-pv-home" x1="115" y1="60" x2="205" y2="100" class="stroke-amber-500" opacity="0.12" />
    <line id="flow-battery-home" x1="120" y1="170" x2="210" y2="135" class="stroke-green-600" opacity="0.12" />
    <line id="flow-home-battery" x1="210" y1="140" x2="120" y2="175" class="stroke-green-600" stroke-dasharray="4 3" opacity="0.12" />
    <line id="flow-grid-home" x1="375" y1="60" x2="280" y2="105" class="stroke-gray-500" opacity="0.12" />
    <line id="flow-home-grid" x1="280" y1="100" x2="375" y2="55" class="stroke-gray-500" stroke-dasharray="4 3" opacity="0.12" />
    <line id="flow-home-ev" x1="280" y1="130" x2="365" y2="175" class="stroke-sky-600" opacity="0.12" />
  </g>
</svg>
<div class="mt-2 flex flex-wrap justify-center gap-4 text-xs text-gray-500 dark:text-gray-400">
  <span><span class="inline-block h-2 w-2 rounded-full bg-amber-500"></span> PV</span>
  <span><span class="inline-block h-2 w-2 rounded-full bg-green-600"></span> Baterie</span>
  <span><span class="inline-block h-2 w-2 rounded-full bg-gray-500"></span> Retea</span>
  <span><span class="inline-block h-2 w-2 rounded-full bg-sky-600"></span> EV</span>
</div>
