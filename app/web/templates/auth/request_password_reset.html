{% extends "base_public.html" %}
{% block title %}Resetare parola - {{ app_name }}{% endblock %}
{% block content %}
<div class="card">
  <h1 class="mb-4 text-xl font-semibold">Resetare parola</h1>
  {% if sent %}
  <p class="text-sm text-gray-700 dark:text-gray-300">
    Daca adresa exista in platforma, am trimis un link de resetare (valabil timp limitat).
  </p>
  <a class="mt-4 inline-block text-brand-700 hover:underline dark:text-brand-300" href="/login">Inapoi la autentificare</a>
  {% else %}
  <form method="post" action="/request-password-reset" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
    <div>
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" required autofocus />
    </div>
    <button type="submit" class="btn-primary w-full">Trimite link de resetare</button>
  </form>
  {% endif %}
</div>
{% endblock %}
