{% extends "base_public.html" %}
{% block title %}Parola noua - {{ app_name }}{% endblock %}
{% block content %}
<div class="card">
  <h1 class="mb-4 text-xl font-semibold">Seteaza o parola noua</h1>
  {% if error %}
  <p class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-900/30 dark:text-red-300">{{ error }}</p>
  {% endif %}
  <form method="post" action="/reset-password" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
    <input type="hidden" name="token" value="{{ token }}" />
    <div>
      <label class="label" for="password">Parola noua</label>
      <input class="input" type="password" id="password" name="password" required minlength="10" autocomplete="new-password" />
    </div>
    <div>
      <label class="label" for="password_confirm">Confirma parola</label>
      <input class="input" type="password" id="password_confirm" name="password_confirm" required minlength="10" autocomplete="new-password" />
    </div>
    <button type="submit" class="btn-primary w-full">Salveaza parola</button>
  </form>
</div>
{% endblock %}
